# Default values for inventory-storage.

replicaCount: 1

image:
  repository: inventory-storage
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: inventory-storage.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Falls back to in-memory adapters + log-only event publishing when
# database.url / kafka.enabled are left empty, same as running the binary
# locally with no env vars set.
config:
  httpAddr: ":8080"
  eventPublisher: "log"   # "log" or "kafka"
  migrationsPath: "migrations"

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# This service only PUBLISHES to Kafka (StockReserved / ReservationRevoked);
# it has no inbound consumer. kafka.enabled gates EVENT_PUBLISHER=kafka.
kafka:
  enabled: false
  brokers: "kafka:9092"

extraEnv: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}
