{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inventory-storage.databaseSecretName" . }}
  labels:
    {{- include "inventory-storage.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
{{- if and (or .Values.auth.readKey .Values.auth.readWriteKey .Values.facilityLayout.apiKey) (not .Values.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inventory-storage.authSecretName" . }}
  labels:
    {{- include "inventory-storage.labels" . | nindent 4 }}
type: Opaque
stringData:
  # REST bearer keys (ADR-0014). Each key is rendered only when non-empty; the
  # binary ignores an empty key, so a missing key can never authorize anyone.
  {{- if .Values.auth.readKey }}
  API_READ_KEY: {{ .Values.auth.readKey | quote }}
  {{- end }}
  {{- if .Values.auth.readWriteKey }}
  API_READWRITE_KEY: {{ .Values.auth.readWriteKey | quote }}
  {{- end }}
  {{- if .Values.facilityLayout.apiKey }}
  FACILITY_LAYOUT_API_KEY: {{ .Values.facilityLayout.apiKey | quote }}
  {{- end }}
{{- end }}
