{{- if and .Values.mcp.enabled (not .Values.mcp.existingSecret) }}
{{- if or .Values.mcp.readKey .Values.mcp.readWriteKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inventory-storage.mcpSecretName" . }}
  labels:
    {{- include "inventory-storage.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  {{- with .Values.mcp.readKey }}
  # Grants read scope: check_availability, get_bin_occupancy, resources, prompts.
  MCP_READ_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.mcp.readWriteKey }}
  # Grants read-write scope: additionally revoke_reservation.
  MCP_READWRITE_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
